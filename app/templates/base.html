<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survive The College Semester</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    // Apply the saved theme before the page paints, so it doesn't flash
    try {
      var saved = localStorage.getItem("theme");
      if (saved) document.documentElement.setAttribute("data-bs-theme", saved);
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Top bar: site name on the left, theme toggle on the right -->
  <div class="d-flex justify-content-between align-items-center p-3">
    <h1 class="h3 m-0">Survive The College Semester</h1>
    <div class="d-flex gap-2">
    <button id="theme-toggle" type="button" class="btn btn-outline-secondary btn-sm">
      Switch theme
    </button>
    {% if session.get('player_id') %}
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary btn-sm">Log out</a>
    {% endif %}
    </div>
  </div>

  <div class="container" style="max-width: 420px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
  </div>

  {% block content %}{% endblock %}

  <!--The script below is used to toggle the theme between light and dark mode when the button is clicked.-->
  <!--It also saves the selected theme in localStorage so that it persists across page reloads.-->
  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var html = document.documentElement;
      var next = html.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-bs-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  </script>
</body>
</html>
